<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvZ Fusion 4.0</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #2b2b2b; color: #fff; }
        .container { max-width: 1400px; margin: auto; background: #3c3c3c; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .controls { margin-bottom: 15px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #333; padding: 12px; border-radius: 6px; border: 1px solid #555; }
        .controls input[type="text"] { padding: 8px; font-size: 16px; width: 80px; font-weight: bold; text-align: center; border: 2px solid #555; border-radius: 4px; background: #222; color: #0f0; }
        .controls button { padding: 8px 15px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-weight: bold; }
        .controls button:hover { background-color: #45a049; }
        .controls button.clear { background-color: #f44336; }
        .controls button.clear:hover { background-color: #d32f2f; }
        .controls select { padding: 8px; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; outline: none; font-weight: bold; }

        .checkbox-container { display: flex; align-items: center; gap: 6px; background: #222; padding: 6px 12px; border-radius: 4px; border: 1px solid #555; cursor: pointer; user-select: none; font-size: 14px; font-weight: bold; color: #ffeb3b; }
        .checkbox-container input { cursor: pointer; width: 16px; height: 16px; }

        .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tab-btn { padding: 6px 14px; background: #333; color: #ccc; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .tab-btn.active { background: #2196F3; color: white; border-color: #64b5f6; }
        .tab-btn:hover:not(.active) { background: #444; color: #fff; }

        .main-layout { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
        
        .left-panel { flex: 0 0 750px; }
        .grid { display: grid; grid-template-columns: repeat(10, 75px); grid-template-rows: repeat(6, 75px); width: 100%; height: 100%; }
        
        .cell { 
            width: 75px; height: 75px; 
            border: 1px solid #444;
            box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; user-select: none; 
            position: relative; 
            background-color: #2a2a2a; 
        }
        .cell:hover { background: #444; border-color: #00ff00; }
        
        .cell img { position: absolute; pointer-events: none; object-fit: contain; }
        
        .cell img.base-cell { width: 75px; height: 75px; bottom: 0px; left: 50%; transform: translateX(-50%); z-index: 1; }
        .cell img.armor-cell { width: 85px; height: auto; bottom: 5px; left: 50%; transform: translateX(-50%); z-index: 20; }
        .cell img.flying-cell { width: 70px; height: auto; bottom: 35px; left: 50%; transform: translateX(-50%); z-index: 30; }
        .cell img.normal-cell { width: 75px; height: 75px; bottom: 0px; left: 50%; transform: translateX(-50%); z-index: 5; }
        .cell img.two-cell { width: 75px; height: 75px; bottom: 0px; left: 0; transform: none; z-index: 10; }

        .cell img.puff-1 { width: 45px; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 10; } 
        .cell img.puff-2 { width: 45px; bottom: 2px; left: -2px; transform: none; z-index: 11; } 
        .cell img.puff-3 { width: 45px; bottom: 2px; right: -2px; left: auto; transform: none; z-index: 12; } 

        .cell .id-text { position: absolute; bottom: 2px; right: 2px; font-size: 11px; color: #00ff00; text-shadow: 1px 1px 2px black; z-index: 99; pointer-events: none; font-family: monospace; }

        .right-panel { flex: 1; background: #3c3c3c; padding: 15px; border-radius: 8px; border: 1px solid #555; }
        
        .seed-bank { display: grid; grid-template-columns: repeat(9, 45px); grid-template-rows: repeat(7, 65px); gap: 6px; justify-content: center; min-height: 490px; }
        .seed-card { width: 50px; height: 65px; background: #555; border: 2px solid #333; border-radius: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; box-sizing: border-box; }
        .seed-card:hover { border-color: #ffeb3b; background: #666; transform: scale(1.05); }
        .seed-card.selected { border-color: #00ff00; box-shadow: 0 0 10px #00ff00; background: #444; }
        
        .seed-card img { width: 34px; height: 34px; object-fit: contain; }
        .seed-card .seed-id { font-size: 10px; font-weight: bold; margin-top: 4px; background: rgba(0,0,0,0.6); width: 100%; text-align: center; color: white; }

        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; background: #222; padding: 8px 12px; border-radius: 5px; }
        .pagination button { padding: 5px 12px; font-size: 13px; background: #2196F3; border: none; color: white; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .pagination button:hover { background: #0b7dda; }
        .pagination button:disabled { background: #555; color: #888; cursor: not-allowed; }

        textarea { width: 100%; height: 180px; font-family: monospace; padding: 10px; box-sizing: border-box; border: 1px solid #555; border-radius: 4px; background: #222; color: #0f0; margin-top: 10px; }
    </style>
</head>

    const hp_640k = ["1151","308"];
    const hp_96k  = ["913","925"];

    const hp_1k5  = ["39","1264","1258","1259","1402"];

    const hp_600  = ["1207"];

    let currentTab = "all";
    let currentPage = 1;
    const itemsPerPage = 63;
    const plantEntries = Object.entries(plantImages);

    function initTabs() {
        const container = document.getElementById('tabContainer');
        container.innerHTML = '';
        Object.keys(plantCategories).forEach(catKey => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${catKey === currentTab ? 'active' : ''}`;
            btn.innerText = plantCategories[catKey].name;
            btn.onclick = () => switchTab(catKey);
            container.appendChild(btn);
        });
    }

    function switchTab(catKey) {
        currentTab = catKey;
        currentPage = 1;
        initTabs();
        renderSeedBank();
    }

    function getFilteredPlants() {
        if (currentTab === "all") return plantEntries;
        const allowedIds = plantCategories[currentTab].ids || [];
        return plantEntries.filter(([id]) => allowedIds.includes(id));
    }

    function renderSeedBank() {
        const bank = document.getElementById('seedBank');
        bank.innerHTML = '';
        const filtered = getFilteredPlants();
        const totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
        
        const start = (currentPage - 1) * itemsPerPage;
        const currentItems = filtered.slice(start, start + itemsPerPage);
        let currentInputVal = document.getElementById('plantId').value.trim();

        currentItems.forEach(([id, imgSrc]) => {
            const card = document.createElement('div');
            card.className = 'seed-card' + (currentInputVal === id ? ' selected' : '');
            card.id = 'seed-' + id;
            
            if (imgSrc) {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.onerror = function() { this.style.display='none'; };
                card.appendChild(img);
            }

            const idLabel = document.createElement('div');
            idLabel.className = 'seed-id';
            idLabel.innerText = id;
            card.appendChild(idLabel);

            card.onclick = () => selectSeed(id, card);
            bank.appendChild(card);
        });

        document.getElementById('pageInfo').innerText = `Trang ${currentPage} / ${totalPages}`;
        document.getElementById('btnPrev').disabled = currentPage === 1;
        document.getElementById('btnNext').disabled = currentPage >= totalPages;
    }

    function prevPage() { if (currentPage > 1) { currentPage--; renderSeedBank(); } }
    function nextPage() { currentPage++; renderSeedBank(); }

    function handleManualInput() {
        document.querySelectorAll('.seed-card').forEach(c => c.classList.remove('selected'));
        const manualId = document.getElementById('plantId').value.trim();
        const matchingCard = document.getElementById('seed-' + manualId);
        if(matchingCard) matchingCard.classList.add('selected');
    }

    function selectSeed(id, cardElement) {
        document.getElementById('plantId').value = id;
        document.querySelectorAll('.seed-card').forEach(c => c.classList.remove('selected'));
        if(cardElement) cardElement.classList.add('selected');
    }

    function selectEraseMode() {
        document.getElementById('plantId').value = "-1";
        document.querySelectorAll('.seed-card').forEach(c => c.classList.remove('selected'));
    }

    function canPlant(cellArray, inputId) {
        let hasBase = false, hasArmor = false, hasFlying = false, hasStandard = false;
        let puffCount = 0;

        cellArray.forEach(id => {
            if (puffShrooms.includes(id)) puffCount++;
            else if (basePlants.includes(id)) hasBase = true;
            else if (armorPlants.includes(id)) hasArmor = true;
            else if (flyingPlants.includes(id)) hasFlying = true;
            else hasStandard = true;
        });

        if (puffShrooms.includes(inputId)) {
            if (hasStandard) return false;
            return puffCount < 3;
        }

        if (basePlants.includes(inputId)) return !hasBase;
        if (armorPlants.includes(inputId)) return !hasArmor;
        if (flyingPlants.includes(inputId)) return !hasFlying;

        if (puffCount > 0) return false;
        return !hasStandard;
    }

    function applyShovel(cellArray, shovelMode) {
        if (shovelMode === "all") return [];
        
        return cellArray.filter(id => {
            if (shovelMode === "armor" && armorPlants.includes(id)) return false;
            if (shovelMode === "base" && basePlants.includes(id)) return false;
            if (shovelMode === "flying" && flyingPlants.includes(id)) return false;
            if (shovelMode === "normal") {
                const isSpecial = armorPlants.includes(id) || basePlants.includes(id) || flyingPlants.includes(id);
                if (!isSpecial) return false; 
            }
            return true;
        });
    }

    const gridElement = document.getElementById('grid');

    function initGrid() {
        gridElement.innerHTML = '';
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.style.zIndex = 100 + (r * 10) - c;
                gridElements[r][c] = cell;

                updateCellVisual(cell, gridData[r][c]);

                cell.onclick = () => handleCellClick(r, c);
                gridElement.appendChild(cell);
            }
        }
    }

    function handleCellClick(r, c) {
        let inputId = document.getElementById('plantId').value.trim();
        let isColumnMode = document.getElementById('chkColumnMode').checked;
        let shovelMode = document.getElementById('shovelModeSelect').value;

        let targetRows = isColumnMode ? [0, 1, 2, 3, 4, 5] : [r];

        targetRows.forEach(row => {
            if (inputId === "-1" || inputId === "") {
                gridData[row][c] = applyShovel(gridData[row][c], shovelMode);
            } else {
                if (canPlant(gridData[row][c], inputId)) {
                    gridData[row][c].push(inputId);
                } else {
                    gridElements[row][c].style.backgroundColor = '#ff4444';
                    setTimeout(() => { gridElements[row][c].style.backgroundColor = '#2a2a2a'; }, 200);
                }
            }
            updateCellVisual(gridElements[row][c], gridData[row][c]);
        });
    }

    function updateCellVisual(cell, plantArray) {
        cell.innerHTML = ''; 
        let idTexts = [];
        
        if (plantArray && plantArray.length > 0) {
            plantArray.forEach((idStr, index) => {
                if (plantImages[idStr] && plantImages[idStr] !== "") {
                    const img = document.createElement('img');
                    img.src = plantImages[idStr];
                    
                    if (twoCellPlants.includes(idStr)) {
                        img.className = 'two-cell';
                    } else if (puffShrooms.includes(idStr)) {
                        let pIndex = 1;
                        for (let i = 0; i < index; i++) {
                            if (puffShrooms.includes(plantArray[i])) pIndex++;
                        }
                        img.className = 'puff-' + pIndex;
                    } else if (basePlants.includes(idStr)) {
                        img.className = 'base-cell';
                    } else if (armorPlants.includes(idStr)) {
                        img.className = 'armor-cell';
                    } else if (flyingPlants.includes(idStr)) {
                        img.className = 'flying-cell';
                    } else {
                        img.className = 'normal-cell';
                    }

                    img.onerror = function() { this.style.display = 'none'; };
                    cell.appendChild(img);
                }
                idTexts.push(idStr);
            });

            const text = document.createElement('div');
            text.className = 'id-text';
            text.innerText = idTexts.join(',');
            cell.appendChild(text);
        }
    }

    function clearGrid() {
        if(confirm("Xoá toàn bộ sân trồng?")) {
            gridData = Array.from({ length: rows }, () => Array.from({ length: cols }, () => []));
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    updateCellVisual(gridElements[r][c], gridData[r][c]);
                }
            }
            document.getElementById('output').value = "";
        }
    }

    function exportData() {
        let outputStr = "";
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                let cellPlants = gridData[row][col]; 
                cellPlants.forEach(idStr => {
                    let health = 300; 
                    if (hp_640k.includes(idStr)) health = 640000;
                    else if (hp_96k.includes(idStr)) health = 96000;
                    else if (hp_64k.includes(idStr)) health = 64000;
                    else if (hp_32k.includes(idStr)) health = 32000;
                    else if (hp_16k.includes(idStr)) health = 16000;
                    else if (hp_8k.includes(idStr)) health = 8000;
                    else if (hp_6k.includes(idStr)) health = 6000;
                    else if (hp_4k.includes(idStr)) health = 4000;
                    else if (hp_3k.includes(idStr)) health = 3000;
                    else if (hp_2k.includes(idStr)) health = 2000;
                    else if (hp_1k8.includes(idStr)) health = 1800;
                    else if (hp_1k5.includes(idStr)) health = 1500;
                    else if (hp_1k.includes(idStr)) health = 1000;
                    else if (hp_600.includes(idStr)) health = 600;

                    outputStr += `{\n`;
                    outputStr += `"thePlantColumn": ${col},\n`;
                    outputStr += `"thePlantRow": ${row},\n`;
                    outputStr += `"thePlantType": ${idStr},\n`;
                    outputStr += `"thePlantHealth": ${health},\n`;
                    outputStr += `"theLilyType": 0,\n`;
                    outputStr += `"thePlantStage": 0,\n`;
                    outputStr += `"theAttributeCount": 0,\n`;
                    outputStr += `"theLevel": 0,\n`;
                    outputStr += `"imitatless": false,\n`;
                    outputStr += `"diemeanlose": false,\n`;
                    outputStr += `"uncrashable": false,\n`;
                    outputStr += `"starUp": false,\n`;
                    outputStr += `"towards": 0,\n`;
                    outputStr += `"upgradeType": 0,\n`;
                    outputStr += `"objects": []\n`;
                    outputStr += `},\n`;
                });
            }
        }
        document.getElementById('output').value = outputStr;
    }

    function downloadJson() {
        let text = document.getElementById('output').value;
        if (!text) { alert("Tạo đội hình và bấm 'Xuất Code' trước!"); return; }
        text = text.trim();
        if (text.endsWith(",")) text = text.slice(0, -1);
        const finalJson = "[\n" + text + "\n]";
        const blob = new Blob([finalJson], { type: "application/json" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "pvzfusion.json";
        a.click();
    }

    initTabs();
    renderSeedBank();
    initGrid();
</script>
